name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PII guard: fail fast if a real .olax data file or .pi/ session dir ever
  # gets tracked. The .gitignore blocks these, but CI is the last line of
  # defense — a tracked sample/patient data file must never land on GitHub.
  no-pii:
    name: "Guard: no .olax / .pi committed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify no tracked data files
        run: |
          set -e
          if git ls-files | grep -iE '\.olax$|^\.pi/'; then
            echo "::error::Refusing to build: tracked .olax (sample/patient PII) or .pi/ files detected"
            exit 1
          fi
          echo "OK: no .olax or .pi/ files are tracked."

  test:
    name: Test (Node ${{ matrix.node }})
    needs: no-pii
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

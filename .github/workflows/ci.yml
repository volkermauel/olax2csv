name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PII guard: fail fast if a real .olax data file or .pi/ session dir ever
  # gets tracked. The .gitignore blocks these, but CI is the last line of
  # defense — a tracked sample/patient data file must never land on GitHub.
  no-pii:
    name: "Guard: no .olax / .pi committed"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify no tracked data files
        run: |
          set -e
          if git ls-files | grep -iE '\.(olax|zip|rar|7z)$|^\.pi/'; then
            echo "::error::Refusing to build: tracked OpenLab data export"
            echo "(.olax/.zip/.rar/.7z = sample/patient PII)"
            echo "or .pi/ files detected"
            exit 1
          fi
          echo "OK: no .olax/.zip/.rar/.7z or .pi/ files are tracked."

  test:
    name: Test (Node ${{ matrix.node }})
    needs: no-pii
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20.x, 22.x, 24.x]
    steps:
      - uses: actions/checkout@v5
      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm test

  # Deploy the stamped single-file app to GitHub Pages. The repo keeps clean
  # __COMMIT__/__BUILT__ placeholders; only the published artifact carries the
  # real values (local file use shows no badge instead of stale info).
  deploy:
    name: Deploy to GitHub Pages
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Stamp build info
        run: |
          set -e
          sha="${GITHUB_SHA::7}"
          ts="$(date -u '+%Y-%m-%d %H:%M UTC')"
          sed -i "s/__COMMIT__/$sha/" index.html
          sed -i "s/__BUILT__/$ts/" index.html
          grep -q "$sha" index.html   # sanity: tokens really replaced
          echo "stamped $sha / $ts"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
